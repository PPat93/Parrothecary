<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Parrothecary — offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 2rem 1.5rem;
        text-align: center;
        background: #0b0c10;
        color: #f3f4f6;
        font:
          16px/1.5 system-ui,
          -apple-system,
          sans-serif;
      }
      .disc {
        width: 7rem;
        height: 7rem;
        border-radius: 50%;
        background: #06070a;
        display: grid;
        place-items: center;
      }
      img {
        width: 6rem;
        height: 6rem;
        object-fit: contain;
      }
      h1 {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 600;
      }
      p {
        margin: 0;
        max-width: 26rem;
        color: #9aa0aa;
        font-size: 0.9rem;
      }
      button {
        margin-top: 0.5rem;
        min-height: 44px;
        padding: 0 1.25rem;
        border-radius: 0.75rem;
        border: 1px solid #7cc4ea;
        background: transparent;
        color: #7cc4ea;
        font: inherit;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="disc"><img src="/icons/icon-192.png" alt="" /></div>
    <h1>Parrothecary can’t reach the server</h1>
    <!--
      Deliberately not showing cached stock. A medicine cabinet answer that is
      silently out of date is worse than admitting we cannot answer.
    -->
    <p>
      Your stock lives on the home server, so it is only available on the house network. Check
      you are connected to wifi — or on the VPN if you are away — and try again.
    </p>
    <button type="button" onclick="location.reload()">Try again</button>
  </body>
</html>
